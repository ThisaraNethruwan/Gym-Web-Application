<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="greeting-page">
    <div class="greeting-container">
        <h1>Registration Successful !</h1>
        <p>Thank you for registering ! We’re thrilled to have you with us.</p>
        <p>
            <a href="index.html" class="home-btn">Back to Home</a>
        </p>
    </div>
</body>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(45deg, #ffffff);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .greeting-container {
        text-align: center;
        background: rgba(255, 255, 255, 0.575);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.562);
        max-width: 500px;
        width: 100%;
        animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 2.5em;
        color: #2d2d2d;
        margin-bottom: 20px;
        font-weight: 600;
    }

    p {
        font-family: 'Poppins', sans-serif;
        font-size: 1.1em;
        color: #4a4a4a;
        margin-bottom: 20px;
    }

    .home-btn {
        text-decoration: none;
        padding: 12px 25px;
        background-color: #1b7906d5;
        color: white;
        font-size: 1.1em;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }

    .home-btn:hover {
        background-color: #0c0e97;
    }

    /* Animation */
    @keyframes fadeIn {
        0% {
            opacity: 0;
            transform: translateY(30px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
